<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍳 Cocina - Bar Aeródromo La Juliana</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0b09;
      --surface: #161410;
      --card: #1e1c18;
      --card2: #252320;
      --border: rgba(255,255,255,0.07);
      --gold: #d4a853;
      --red: #c94a3a;
      --green: #4caf50;
      --text: #f2ede6;
      --muted: #9a9080;
      --dim: #5a5248;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding: 30px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 3px solid var(--border);
    }

    .header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      color: var(--gold);
      margin: 0;
    }

    .header-right {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    .counter-box {
      background: rgba(212, 168, 83, 0.1);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 16px 24px;
      text-align: center;
    }

    .counter-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .counter-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--gold);
    }

    .tabs-container {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 3px solid var(--border);
    }

    .tab-btn {
      padding: 16px 28px;
      border: none;
      border-bottom: 4px solid transparent;
      background: none;
      color: var(--muted);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.5px;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.on { color: var(--gold); border-bottom-color: var(--gold); }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 20px;
      background: rgba(76, 175, 80, 0.1);
      border: 2px solid rgba(76, 175, 80, 0.3);
      font-size: 14px;
      font-weight: 600;
      color: var(--green);
    }

    .status-badge.off {
      background: rgba(201, 74, 58, 0.1);
      border-color: rgba(201, 74, 58, 0.3);
      color: var(--red);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-badge.off .status-dot { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .container { max-width: 1600px; margin: 0 auto; }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 24px;
    }

    .order-card {
      background: var(--card);
      border: 3px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .order-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: var(--gold);
    }

    .order-card:hover {
      border-color: var(--gold);
      box-shadow: 0 12px 48px rgba(212, 168, 83, 0.25);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
    }

    .table-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
    }

    .order-time { font-size: 14px; color: var(--muted); }

    .pickup-time {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(212, 168, 83, 0.15);
      border: 2px solid var(--gold);
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 14px;
    }

    .pickup-time-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .pickup-time-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }

    .customer-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }

    .items-list {
      margin: 16px 0;
      padding: 16px;
      background: rgba(212, 168, 83, 0.08);
      border-radius: 10px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      font-size: 26px;
      border-bottom: 1px solid var(--border);
    }

    .item:last-child { border-bottom: none; }

    .item-name { flex: 1; font-weight: 700; }

    .item-qty {
      background: var(--gold);
      padding: 6px 18px;
      border-radius: 8px;
      margin: 0 0 0 16px;
      font-weight: 900;
      color: #0c0b09;
      font-size: 28px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    .btn {
      flex: 1;
      padding: 14px 16px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .btn-ready { background: var(--green); color: white; }
    .btn-ready:hover {
      background: #45a049;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
    }

    .btn-remove { background: var(--red); color: white; }
    .btn-remove:hover {
      background: #b83f33;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(201, 74, 58, 0.3);
    }

    .btn-toggle { background: var(--card2); color: var(--gold); border: 2px solid var(--gold); }
    .btn-toggle:hover {
      background: rgba(212, 168, 83, 0.15);
      transform: translateY(-2px);
    }

    .items-collapsed { display: none; }
    .items-collapsed.open { display: block; }

    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 40px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state-icon { font-size: 80px; margin-bottom: 24px; opacity: 0.5; }
    .empty-state-text { font-size: 24px; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--muted);
      font-size: 16px;
    }

    .spinner {
      display: inline-block;
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 12px;
    }

    .clock {
      font-family: 'Cormorant Garamond', serif;
      font-size: 52px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 2px;
      line-height: 1;
    }

    .clock-date {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 1px;
      margin-top: 4px;
      text-transform: capitalize;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🍳 Cocina</h1>
    <div style="text-align:center">
      <div class="clock" id="clock">00:00:00</div>
      <div class="clock-date" id="clockDate"></div>
    </div>
    <div class="header-right">
      <div class="counter-box">
        <div class="counter-label">Comandas Hoy</div>
        <div class="counter-value" id="totalCommands">0</div>
      </div>
      <div class="counter-box">
        <div class="counter-label">Recibidas</div>
        <div class="counter-value" id="receivedCommands">0</div>
      </div>
      <div class="status-badge" id="statusBadge">
        <div class="status-dot"></div>
        <span id="statusText">Conectado</span>
      </div>
    </div>
  </div>

  <div class="tabs-container">
    <button class="tab-btn on" onclick="switchTab('en_proceso', event)">📋 En Proceso</button>
    <button class="tab-btn" onclick="switchTab('hechos', event)">✅ Hechos</button>
  </div>

  <div class="container">
    <div class="board" id="board">
      <div class="loading">
        <div class="spinner"></div>
        <span>Cargando comandas...</span>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    let ordersEnProceso = {};
    let ordersHechas = {};
    let currentTab = 'en_proceso';
    let totalCommandsToday = 0;

    let orderNumberMap = {};
    let nextOrderNumber = 1;

    function assignNumber(id) {
      if (!orderNumberMap[id]) {
        orderNumberMap[id] = nextOrderNumber++;
      }
      return orderNumberMap[id];
    }

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m + ':' + s;
      document.getElementById('clockDate').textContent = now.toLocaleDateString('es-ES', {
        weekday: 'long', day: 'numeric', month: 'long'
      });
    }
    updateClock();
    setInterval(updateClock, 1000);

    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('✓ Conectado a cocina');
        updateStatusBadge(true);
        loadOrders();
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'nuevo_pedido') {
            ordersEnProceso[msg.pedido.id] = msg.pedido;
            assignNumber(msg.pedido.id);
            totalCommandsToday++;
            updateCounters();
            renderBoard();
          }
        } catch (err) {
          console.error('Error procesando mensaje:', err);
        }
      };

      ws.onerror = (err) => {
        console.error('Error WebSocket:', err);
        updateStatusBadge(false);
      };

      ws.onclose = () => {
        console.log('✗ Desconectado de cocina');
        updateStatusBadge(false);
        setTimeout(connect, 3000);
      };
    }

    function updateStatusBadge(connected) {
      const badge = document.getElementById('statusBadge');
      const text = document.getElementById('statusText');
      if (connected) {
        badge.classList.remove('off');
        text.textContent = 'Conectado';
      } else {
        badge.classList.add('off');
        text.textContent = 'Desconectado';
      }
    }

    function updateCounters() {
      const received = Object.keys(ordersEnProceso).length + Object.keys(ordersHechas).length;
      document.getElementById('totalCommands').textContent = totalCommandsToday;
      document.getElementById('receivedCommands').textContent = received;
    }

    async function loadOrders() {
      try {
        const resEnProceso = await fetch('/api/cocina/comandas');
        const dataEnProceso = await resEnProceso.json();
        ordersEnProceso = {};
        dataEnProceso.forEach(order => {
          ordersEnProceso[order.id] = order;
        });

        const resHechas = await fetch('/api/cocina/listas');
        const dataHechas = await resHechas.json();
        ordersHechas = {};
        dataHechas.forEach(order => {
          ordersHechas[order.id] = order;
        });

        // Asignar números en orden cronológico a todas las órdenes del día
        const todasOrdenadas = [...dataEnProceso, ...dataHechas]
          .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        todasOrdenadas.forEach(order => assignNumber(order.id));

        totalCommandsToday = Object.keys(ordersEnProceso).length + Object.keys(ordersHechas).length;
        updateCounters();
        renderBoard();
      } catch (err) {
        console.error('Error cargando órdenes:', err);
      }
    }

    function switchTab(tab, event) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('on'));
      event.target.classList.add('on');
      renderBoard();
    }

    function renderBoard() {
      const board = document.getElementById('board');
      const orders = currentTab === 'en_proceso' ? ordersEnProceso : ordersHechas;
      const orderList = Object.values(orders).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

      if (orderList.length === 0) {
        const emptyMsg = currentTab === 'en_proceso' ? 'Sin comandas en cocina' : 'Sin comandas completadas';
        const emptyIcon = currentTab === 'en_proceso' ? '✨' : '📭';
        board.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">${emptyIcon}</div>
            <div class="empty-state-text">${emptyMsg}</div>
          </div>
        `;
        return;
      }

      board.innerHTML = orderList.map(order => {
        const time = formatTime(new Date(order.created_at));
        const num = orderNumberMap[order.id] || '?';
        const pickupHtml = order.pickup_time
          ? `<div class="pickup-time"><span class="pickup-time-label">🕐 Recogida</span><span class="pickup-time-value">${order.pickup_time.substring(0,5)}</span></div>`
          : '';

        // Solo renderizar el bloque de items si hay items con nombre
        const itemsFiltered = (order.items || []).filter(item => item.nombre);
        const itemsInner = itemsFiltered.map(item => `
          <div class="item">
            <div class="item-name">${item.nombre}</div>
            <div class="item-qty">×${item.cantidad}</div>
          </div>
        `).join('');

        let itemsHtml = '';
        if (itemsFiltered.length > 0) {
          if (currentTab === 'en_proceso') {
            itemsHtml = `<div class="items-list">${itemsInner}</div>`;
          } else {
            itemsHtml = `<div class="items-list items-collapsed" id="items-${order.id}">${itemsInner}</div>`;
          }
        }

        const actionsHtml = currentTab === 'en_proceso' ? `
          <div class="actions">
            <button class="btn btn-ready" onclick="markReady('${order.id}')">✓ Listo</button>
            <button class="btn btn-remove" onclick="removeOrder('${order.id}', true)">🗑</button>
          </div>
        ` : `
          <div class="actions">
            ${itemsFiltered.length > 0 ? `<button class="btn btn-toggle" id="toggle-${order.id}" onclick="toggleItems('${order.id}')">👁 Ver platos</button>` : ''}
            <button class="btn btn-remove" onclick="removeOrder('${order.id}', false)">🗑 Limpiar</button>
          </div>
        `;

        return `
          <div class="order-card">
            <div class="order-header">
              <div class="table-number">Comanda #${num}</div>
              <div class="order-time">${time}</div>
            </div>
            <div class="customer-name">${order.customer_name}</div>
            ${pickupHtml}
            ${itemsHtml}
            ${actionsHtml}
          </div>
        `;
      }).join('');
    }

    async function markReady(orderId) {
      try {
        const res = await fetch(`/api/orders/${orderId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'listo' })
        });
        if (res.ok) {
          delete ordersEnProceso[orderId];
          const order = await res.json();
          ordersHechas[orderId] = order;
          updateCounters();
          renderBoard();
        }
      } catch (err) {
        console.error('Error:', err);
        alert('Error al actualizar pedido');
      }
    }

    function toggleItems(orderId) {
      const el = document.getElementById('items-' + orderId);
      const btn = document.getElementById('toggle-' + orderId);
      if (!el) return;
      const open = el.classList.toggle('open');
      btn.textContent = open ? '🙈 Ocultar platos' : '👁 Ver platos';
    }

    async function removeOrder(orderId, isFromEnProceso) {
      if (confirm('¿Eliminar esta comanda?')) {
        try {
          if (isFromEnProceso) {
            delete ordersEnProceso[orderId];
          } else {
            delete ordersHechas[orderId];
          }
          updateCounters();
          renderBoard();
        } catch (err) {
          console.error('Error:', err);
        }
      }
    }

    function formatTime(date) {
      return date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }

    document.addEventListener('DOMContentLoaded', connect);
  </script>
</body>
</html>
