<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bar Aeródromo La Juliana</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0b09;--surface:#161410;--card:#1e1c18;--card2:#252320;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --gold:#d4a853;--gold2:#e8c87a;--red:#c94a3a;--amber:#e07b30;
  --text:#f2ede6;--muted:#9a9080;--dim:#5a5248;--r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── SPLASH ── */
#splash{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.glow-top{position:absolute;top:-140px;left:50%;transform:translateX(-50%);width:520px;height:320px;background:radial-gradient(ellipse,rgba(212,168,83,0.2) 0%,transparent 70%);pointer-events:none}
.glow-bot{position:absolute;bottom:0;left:0;right:0;height:180px;background:linear-gradient(0deg,rgba(212,168,83,0.05) 0%,transparent 100%);pointer-events:none}
.splash-inner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 22px 40px;text-align:center;position:relative;z-index:1}

.logo-outer{width:96px;height:96px;border-radius:50%;border:1px solid rgba(212,168,83,0.22);display:flex;align-items:center;justify-content:center;margin-bottom:26px;animation:pulse 4s ease-in-out infinite}
.logo-inner{width:72px;height:72px;border-radius:50%;border:1px solid rgba(212,168,83,0.48);background:rgba(212,168,83,0.06);display:flex;align-items:center;justify-content:center;font-size:30px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,168,83,0.12)}50%{box-shadow:0 0 0 12px rgba(212,168,83,0)}}

.brand{font-family:'Cormorant Garamond',serif;font-size:clamp(26px,7vw,42px);font-weight:700;color:var(--text);line-height:1.05;margin-bottom:4px}
.brand em{color:var(--gold);font-style:italic;display:block}
.brand-tag{font-size:10px;letter-spacing:3.5px;text-transform:uppercase;color:var(--dim);margin-bottom:36px}

.lang-row{display:flex;gap:8px;margin-bottom:36px;width:100%;max-width:290px}
.lpill{flex:1;padding:11px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--card);color:var(--muted);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;letter-spacing:0.6px}
.lpill.on{background:var(--gold);color:#0c0b09;border-color:var(--gold)}
.lpill:not(.on):hover{color:var(--text)}

.cats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px}
.cat-tile{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 16px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:7px;cursor:pointer;transition:all 0.22s;position:relative;overflow:hidden;text-align:left}
.cat-tile::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(212,168,83,0.09) 0%,transparent 55%);opacity:0;transition:opacity 0.3s}
.cat-tile:hover::after{opacity:1}
.cat-tile:hover{border-color:rgba(212,168,83,0.32);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.35)}
.cat-tile:active{transform:scale(0.97)}
.cat-tile.wide{grid-column:1/-1}
.ct-ico{font-size:28px;line-height:1}
.ct-name{font-size:14px;font-weight:600;color:var(--text)}
.ct-cnt{font-size:11px;color:var(--muted)}
.ct-arr{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:20px;font-weight:300}

/* ── SECTION VIEW ── */
#secView{display:none;min-height:100vh}
.sec-nav{position:sticky;top:0;z-index:100;background:rgba(12,11,9,0.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-row{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px}
.back{width:36px;height:36px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--card);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
.back:hover{background:var(--card2)}
.nav-title{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;color:var(--gold);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slpill{padding:6px 10px;border-radius:6px;border:1px solid var(--border2);background:var(--card);color:var(--muted);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:0.8px;transition:all 0.2s}
.slpill.on{background:var(--gold);color:#0c0b09;border-color:var(--gold)}
.cart-pill{position:relative;background:var(--gold);border:none;border-radius:var(--rs);padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:#0c0b09;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;white-space:nowrap}
.cart-pill:hover{background:var(--gold2);transform:translateY(-1px)}
.cbadge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center}
.cbadge.on{display:flex}

.tabs-row{max-width:600px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px;border-bottom:1px solid var(--border)}
.tabs-row::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:11px 14px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all 0.2s;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.stab:hover{color:var(--text)}
.stab.on{color:var(--gold);border-bottom-color:var(--gold)}

.sec-body{max-width:600px;margin:0 auto;padding:16px}
.ssub{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:2.5px;color:var(--dim);margin:22px 0 10px;padding-left:10px;border-left:2px solid var(--gold);line-height:1}

/* ── ITEM CARD ── */
.item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;transition:border-color 0.2s,background 0.15s}
.item:hover{border-color:var(--border2)}
.item.on{border-color:rgba(212,168,83,0.4);background:rgba(212,168,83,0.04)}
.ii{flex:1;min-width:0}
.iname{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.3}
.idesc{font-size:12px;color:var(--muted);line-height:1.5}
.inote{font-size:11px;color:var(--gold);margin-top:3px;font-style:italic}
.ir{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.iprice{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--gold);white-space:nowrap}
.qrow{display:flex;align-items:center;gap:8px}
.qb{width:28px;height:28px;border-radius:50%;border:1px solid var(--border2);background:var(--card2);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;line-height:1}
.qb:hover{background:var(--gold);color:#0c0b09;border-color:var(--gold)}
.qadd{width:32px;height:32px;border-radius:50%;border:none;background:var(--gold);color:#0c0b09;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;line-height:1}
.qadd:hover{background:var(--gold2)}
.qn{font-size:14px;font-weight:700;color:var(--gold);min-width:16px;text-align:center}

.xfries{background:rgba(201,74,58,0.07);border:1px solid rgba(201,74,58,0.2);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:all 0.2s}
.xfries.on{background:rgba(201,74,58,0.14);border-color:rgba(201,74,58,0.4)}
.xfl{font-size:14px;font-weight:600}.xfs{font-size:12px;color:var(--muted);margin-top:2px}
.xfp{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;color:#e06b5a}

/* ── ADD TOAST NOTIFICATION ── */
#addToast{
  position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);
  z-index:500;pointer-events:none;opacity:0;transition:all 0.3s cubic-bezier(0.32,0.72,0,1);
  white-space:nowrap;
}
#addToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-inner{
  background:rgba(224,123,48,0.96);
  border:1px solid rgba(224,123,48,0.6);
  border-radius:24px;padding:10px 18px;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
  backdrop-filter:blur(8px);
}
.toast-ico{font-size:16px}
.toast-msg{font-size:13px;font-weight:600;color:#fff;letter-spacing:0.1px}

/* ── DRAWER ── */
.dbg{position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:200;display:none;backdrop-filter:blur(8px);align-items:flex-end;justify-content:center}
.dbg.on{display:flex}
.drawer{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;border:1px solid var(--border2);border-bottom:none;animation:slideUp 0.28s cubic-bezier(0.32,0.72,0,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.dhandle{width:38px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0;flex-shrink:0}
.dhd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.dtitle{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--gold)}
.xbtn{width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.xbtn:hover{background:var(--red);border-color:var(--red);color:#fff}
.dbody{overflow-y:auto;flex:1;padding:16px 20px}
.dempty{text-align:center;padding:48px 0;color:var(--muted);font-size:15px;line-height:2.4}
.crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.crn{flex:1}.crname{font-size:14px;font-weight:500}.crqty{font-size:12px;color:var(--muted);margin-top:1px}
.crprice{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;color:var(--gold);white-space:nowrap}
.crdel{background:none;border:none;color:var(--dim);cursor:pointer;font-size:20px;padding:0 3px;line-height:1;transition:color 0.2s}
.crdel:hover{color:var(--red)}

/* ── PAY AT COUNTER BANNER ── */
.counter-banner{
  background:rgba(224,123,48,0.1);
  border:1px solid rgba(224,123,48,0.3);
  border-radius:var(--r);padding:14px 16px;
  display:flex;align-items:flex-start;gap:12px;
  margin-bottom:4px;
}
.cb-ico{font-size:22px;flex-shrink:0;margin-top:1px}
.cb-title{font-size:13px;font-weight:700;color:#f0a060;margin-bottom:3px}
.cb-msg{font-size:12px;color:var(--muted);line-height:1.5}

/* ── STRIPE DISABLED BANNER ── */
.stripe-disabled{
  background:var(--card);border:1px solid var(--border);border-radius:var(--rs);
  padding:14px 16px;display:flex;align-items:center;gap:12px;
  opacity:0.6;cursor:not-allowed;
}
.sd-ico{font-size:20px}
.sd-text{flex:1}
.sd-title{font-size:13px;font-weight:600;color:var(--muted)}
.sd-sub{font-size:11px;color:var(--dim);margin-top:2px}
.sd-badge{font-size:10px;font-weight:700;background:var(--card2);border:1px solid var(--border2);color:var(--dim);padding:3px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}

.flabel{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.8px;color:var(--muted);margin-bottom:8px;display:block}
.finput{width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);padding:12px 14px;font-size:15px;font-family:'Inter',sans-serif;transition:border-color 0.2s}
.finput:focus{outline:none;border-color:var(--gold)}
.finput::placeholder{color:var(--dim)}
.tinput{width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);padding:11px 14px;font-size:15px;font-family:'Inter',sans-serif;appearance:none;transition:border-color 0.2s}
.tinput:focus{outline:none;border-color:var(--gold)}
input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(0.6)}
.req-err{color:var(--red);font-size:11px;margin-top:4px;display:none}
.form-block{margin-top:16px}

.dft{padding:16px 20px 30px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.trow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tlbl{font-size:14px;color:var(--muted);font-weight:500}
.tamt{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:var(--gold)}
.obtn{width:100%;background:var(--gold);color:#0c0b09;border:none;border-radius:var(--r);padding:16px;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s}
.obtn:hover:not(:disabled){background:var(--gold2);transform:translateY(-1px);box-shadow:0 8px 28px rgba(212,168,83,0.2)}
.obtn:disabled{background:var(--card2);color:var(--dim);cursor:not-allowed;transform:none;box-shadow:none}

/* ── SUCCESS ── */
.sbg{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:300;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(10px)}
.sbg.on{display:flex}
.sbox{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:40px 28px;text-align:center;max-width:340px;width:100%;animation:popIn 0.38s cubic-bezier(0.175,0.885,0.32,1.275)}
@keyframes popIn{from{transform:scale(0.82);opacity:0}to{transform:scale(1);opacity:1}}
.sico{font-size:64px;display:block;margin-bottom:14px}
.stitle{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:var(--gold);margin-bottom:6px}
.scustomer{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold2);margin-bottom:14px}
.smsg{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:28px;white-space:pre-line}
.sbtn{background:var(--gold);color:#0c0b09;border:none;border-radius:var(--rs);padding:13px 30px;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s}
.sbtn:hover{background:var(--gold2)}

/* ── QR ── */
#qrBtn{position:fixed;bottom:20px;right:16px;z-index:50;background:var(--card2);border:1px solid var(--border2);border-radius:50%;width:42px;height:42px;cursor:pointer;font-size:18px;display:none;align-items:center;justify-content:center;color:var(--muted);box-shadow:0 4px 20px rgba(0,0,0,0.5);transition:all 0.2s}
#qrBtn:hover{background:var(--gold);color:#0c0b09;border-color:var(--gold)}
.qbg{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:250;display:none;align-items:center;justify-content:center;padding:20px}
.qbg.on{display:flex}
.qbox{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:28px 20px;width:100%;max-width:400px}
.qtitle{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--gold);margin-bottom:4px}
.qsub{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5}
.qcard-single{background:#fff;border-radius:10px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}
.qcard-single canvas,.qcard-single img{max-width:160px!important;max-height:160px!important}
.qtname{font-size:15px;font-weight:700;color:#0c0b09;font-family:'Cormorant Garamond',serif}
.qurl{font-size:9px;color:#aaa;word-break:break-all;text-align:center}
.qact{display:flex;flex-direction:column;gap:8px}
.qprint{background:var(--card2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);padding:11px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;width:100%;transition:all 0.2s;display:none}
.qprint:hover{background:var(--gold);color:#0c0b09;border-color:var(--gold)}
.qclose{background:none;border:1px solid var(--border);border-radius:var(--rs);color:var(--muted);padding:11px;font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;width:100%}
.qclose:hover{border-color:var(--border2);color:var(--text)}
</style>
</head>
<body>

<!-- ═══ ADD TOAST ═══ -->
<div id="addToast">
  <div class="toast-inner">
    <span class="toast-ico">🏧</span>
    <span class="toast-msg" id="toastMsg">Pay at the counter when collecting</span>
  </div>
</div>

<!-- ═══ SPLASH ═══ -->
<div id="splash">
  <div class="glow-top"></div>
  <div class="glow-bot"></div>
  <div class="splash-inner">
    <div class="logo-outer">
      <div class="logo-inner">✈️</div>
    </div>
    <div class="brand">Bar Aeródromo<em>La Juliana</em></div>
    <div class="brand-tag">Carta · Menu · Speisekarte</div>
    <div class="lang-row">
      <button class="lpill on" id="pillEN" onclick="setLang('en')">🇬🇧 English</button>
      <button class="lpill"    id="pillES" onclick="setLang('es')">🇪🇸 Español</button>
    </div>
    <div class="cats-grid" id="catsGrid"></div>
  </div>
</div>

<!-- ═══ SECTION VIEW ═══ -->
<div id="secView">
  <div class="sec-nav">
    <div class="nav-row">
      <button class="back" onclick="goHome()">←</button>
      <div class="nav-title" id="secTitle">—</div>
      <button class="slpill on" id="spEN" onclick="setLang('en')">EN</button>
      <button class="slpill"    id="spES" onclick="setLang('es')">ES</button>
      <button class="cart-pill" onclick="openCart()">
        🛒 <span id="cartLbl">Order</span>
        <span class="cbadge" id="cbadge">0</span>
      </button>
    </div>
    <div class="tabs-row" id="tabsRow"></div>
  </div>
  <div class="sec-body" id="secBody"></div>
</div>

<!-- ═══ CART DRAWER ═══ -->
<div class="dbg" id="dbg" onclick="bgClick(event)">
  <div class="drawer">
    <div class="dhandle"></div>
    <div class="dhd">
      <div class="dtitle" id="drawerTitle">Your Order</div>
      <button class="xbtn" onclick="closeCart()">×</button>
    </div>
    <div class="dbody" id="drawerBody"></div>
    <div class="dft" id="drawerFt" style="display:none">
      <div class="trow">
        <span class="tlbl" id="totalLbl">Total</span>
        <span class="tamt" id="totalAmt">0.00€</span>
      </div>
      <button class="obtn" id="orderBtn" onclick="placeOrder()">Confirm Order →</button>
    </div>
  </div>
</div>

<!-- ═══ SUCCESS ═══ -->
<div class="sbg" id="sbg">
  <div class="sbox">
    <span class="sico">✅</span>
    <div class="stitle" id="sTitle">Order Received!</div>
    <div class="scustomer" id="sCustomer"></div>
    <div class="smsg" id="sMsg"></div>
    <button class="sbtn" onclick="closeSuccess()" id="sBtnClose">Got it!</button>
  </div>
</div>

<!-- ═══ QR BUTTON ═══ -->
<button id="qrBtn" onclick="openQR()">◼</button>

<!-- ═══ QR MODAL ═══ -->
<div class="qbg" id="qbg" onclick="qrBgClick(event)">
  <div class="qbox">
    <div class="qtitle">QR Code</div>
    <div class="qsub">Código QR único · escanea para pedir</div>
    <div class="qcard-single" id="qCardSingle"></div>
    <div class="qact">
      <button class="qprint" id="qPrint" onclick="printQR()">🖨️ Imprimir / Print</button>
      <button class="qclose" onclick="closeQR()">Cerrar / Close</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ════════════════════════════════════════════════════════════
// MENU DATA
// ════════════════════════════════════════════════════════════
const MENU = {
  starters:{en:"Starters",es:"Entrantes",emoji:"🥗",

// ════════════════════════════════════════════════════════════
// TOAST — shown every time + is pressed
// ════════════════════════════════════════════════════════════
function showToast() {
  const el = document.getElementById('addToast');
  document.getElementById('toastMsg').textContent = t('toastMsg');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ════════════════════════════════════════════════════════════
// LANGUAGE
// ════════════════════════════════════════════════════════════
function setLang(l) {
  lang = l;
  ['EN','ES'].forEach(x => {
    const on = l === x.toLowerCase();
    document.getElementById('pill'+x)?.classList.toggle('on', on);
    document.getElementById('sp'+x)?.classList.toggle('on', on);
  });
  renderSplash();
  if (curSec) renderSec(curSec);
  if (document.getElementById('dbg').classList.contains('on')) buildDrawer();
}

// ════════════════════════════════════════════════════════════
// SPLASH
// ════════════════════════════════════════════════════════════
function renderSplash() {
  const keys = ['breakfast','starters','mains','drinks'];
  document.getElementById('catsGrid').innerHTML = keys.map((k) => {
    const d = MENU[k];
    const cnt = d.items ? d.items.length : d.subsections.reduce((a,s)=>a+s.items.length,0);
    return `<div class="cat-tile" onclick="openSec('${k}')">
      <div class="ct-ico">${d.emoji}</div>
      <div class="ct-name">${d[lang]}</div>
      <div class="ct-cnt">${cnt} ${t('items')}</div>
      <span class="ct-arr">›</span>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════════════
// SECTION VIEW
// ════════════════════════════════════════════════════════════
function openSec(key) {
  curSec = key;
  document.getElementById('splash').style.display = 'none';
  document.getElementById('secView').style.display = 'block';
  document.getElementById('qrBtn').style.display = 'flex';
  renderSec(key);
  window.scrollTo(0,0);
}
function goHome() {
  document.getElementById('secView').style.display = 'none';
  document.getElementById('splash').style.display = 'flex';
  document.getElementById('qrBtn').style.display = 'none';
  curSec = null;
}
function renderSec(key) {
  const d = MENU[key];
  document.getElementById('secTitle').textContent = d.emoji + ' ' + d[lang];
  document.getElementById('cartLbl').textContent = t('order');
  document.getElementById('tabsRow').innerHTML = Object.keys(MENU).map(k =>
    `<button class="stab${k===key?' on':''}" onclick="openSec('${k}')">${MENU[k][lang]}</button>`
  ).join('');
  const body = document.getElementById('secBody');
  body.innerHTML = '';
  if (d.items) {
    if (key === 'starters') body.appendChild(mkXF());
    d.items.forEach(item => body.appendChild(mkItem(item)));
  } else if (d.subsections) {
    d.subsections.forEach(sub => {
      const st = document.createElement('div');
      st.className = 'ssub'; st.textContent = sub[lang];
      body.appendChild(st);
      sub.items.forEach(item => body.appendChild(mkItem(item)));
    });
    if (key === 'mains') {
      const st = document.createElement('div');
      st.className = 'ssub'; st.textContent = 'Extras';
      body.appendChild(st);
      body.appendChild(mkXF());
    }
  }
  refreshBadge();
}

function mkItem(item) {
  const qty = cart[item.id]?.qty || 0;
  const desc = lang==='en' ? item.de : item.ds;
  const d = document.createElement('div');
  d.className = 'item' + (qty>0?' on':'');
  d.id = 'item-' + item.id;
  d.innerHTML = `
    <div class="ii">
      <div class="iname">${item[lang]}</div>
      <div class="idesc">${desc}</div>
      ${item.note ? `<div class="inote">ℹ️ ${item.note}</div>` : ''}
    </div>
    <div class="ir">
      <div class="iprice">${item.p.toFixed(2)}€</div>
      <div class="qrow">
        ${qty>0 ? `<button class="qb" onclick="adj('${item.id}','${esc(item[lang])}',${item.p},-1)">−</button><span class="qn">${qty}</span>` : ''}
        <button class="${qty===0?'qadd':'qb'}" onclick="adjAndToast('${item.id}','${esc(item[lang])}',${item.p},1)">+</button>
      </div>
    </div>`;
  return d;
}

function mkXF() {
  const qty = cart['xf']?.qty || 0;
  const lbl = lang==='en' ? 'Extra Fries' : 'Patatas Extra';
  const sub = lang==='en' ? 'Add a side of fries' : 'Añade una ración de patatas';
  const d = document.createElement('div');
  d.className = 'xfries' + (qty>0?' on':'');
  d.innerHTML = `
    <div>
      <div class="xfl">🍟 ${lbl}</div>
      <div class="xfs">${sub}</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="xfp">1.00€</span>
      <div class="qrow">
        ${qty>0 ? `<button class="qb" onclick="adj('xf','${lbl}',1.00,-1)">−</button><span class="qn">${qty}</span>` : ''}
        <button class="${qty===0?'qadd':'qb'}" onclick="adjAndToast('xf','${lbl}',1.00,1)">+</button>
      </div>
    </div>`;
  return d;
}

function esc(s) { return s.replace(/'/g,"\\'"); }

// ════════════════════════════════════════════════════════════
// CART
// ════════════════════════════════════════════════════════════
function adjAndToast(id, name, price, delta) {
  adj(id, name, price, delta);
  if (delta > 0) showToast();
}

function adj(id, name, price, delta) {
  if (!cart[id]) cart[id] = {name, price, qty:0};
  cart[id].name = name; cart[id].qty = Math.max(0, cart[id].qty + delta);
  if (cart[id].qty === 0) delete cart[id];
  refreshBadge();
  if (curSec) renderSec(curSec);
  if (document.getElementById('dbg').classList.contains('on')) buildDrawer();
}

function refreshBadge() {
  const n = Object.values(cart).reduce((a,c)=>a+c.qty,0);
  const b = document.getElementById('cbadge');
  b.textContent = n; b.classList.toggle('on', n>0);
}

function openCart() { buildDrawer(); document.getElementById('dbg').classList.add('on'); document.body.style.overflow='hidden'; }
function closeCart() { document.getElementById('dbg').classList.remove('on'); document.body.style.overflow=''; }
function bgClick(e) { if (e.target===document.getElementById('dbg')) closeCart(); }

// ════════════════════════════════════════════════════════════
// BUILD DRAWER
// ════════════════════════════════════════════════════════════
function buildDrawer() {
  const items = Object.entries(cart);
  const body  = document.getElementById('drawerBody');
  const ft    = document.getElementById('drawerFt');
  document.getElementById('drawerTitle').textContent = t('yourOrder');

  if (items.length === 0) {
    body.innerHTML = `<div class="dempty">🍽️<br>${t('empty')}</div>`;
    ft.style.display = 'none'; return;
  }

  let total = 0, html = '';

  // Cart rows
  items.forEach(([id,item]) => {
    const sub = item.price * item.qty; total += sub;
    html += `<div class="crow">
      <div class="crn">
        <div class="crname">${item.name}</div>
        <div class="crqty">×${item.qty} · ${item.price.toFixed(2)}€</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="crprice">${sub.toFixed(2)}€</div>
        <button class="crdel" onclick="delItem('${id}')">×</button>
      </div>
    </div>`;
  });

  // Pay-at-counter banner
  html += `<div class="form-block">
    <div class="counter-banner">
      <span class="cb-ico">🏧</span>
      <div>
        <div class="cb-title">${t('counterTitle')}</div>
        <div class="cb-msg">${t('counterMsg')}</div>
      </div>
    </div>
  </div>`;

  // Stripe disabled notice
  html += `<div class="form-block">
    <div class="stripe-disabled">
      <span class="sd-ico">💳</span>
      <div class="sd-text">
        <div class="sd-title">${t('stripeTitle')}</div>
        <div class="sd-sub">${t('stripeDisabled')}</div>
      </div>
      <span class="sd-badge">${t('stripeSub')}</span>
    </div>
  </div>`;

  // Name field
  html += `<div class="form-block">
    <label class="flabel">${t('nameLabel')}</label>
    <input class="finput" id="custName" type="text" placeholder="${t('namePh')}" autocomplete="given-name" maxlength="40">
    <div class="req-err" id="nameErr">${t('nameReq')}</div>
  </div>`;

  // Phone field
  html += `<div class="form-block">
    <label class="flabel">${t('phoneLabel')}</label>
    <input class="finput" id="custPhone" type="tel" placeholder="${t('phonePh')}" autocomplete="tel" maxlength="20" inputmode="numeric">
    <div class="req-err" id="phoneErr">${t('phoneReq')}</div>
  </div>`;

  // Pickup time
  html += `<div class="form-block" style="margin-bottom:8px">
    <label class="flabel">${t('pickup')}</label>
    <input type="time" class="tinput" id="pTime" min="07:00" max="23:00">
  </div>`;

  body.innerHTML = html;
  ft.style.display = 'block';
  document.getElementById('totalLbl').textContent = t('total');
  document.getElementById('totalAmt').textContent = total.toFixed(2) + '€';
  document.getElementById('orderBtn').textContent = t('placeOrder');
  document.getElementById('orderBtn').disabled = false;
}

function delItem(id) {
  delete cart[id];
  refreshBadge();
  if (curSec) renderSec(curSec);
  buildDrawer();
}

// ════════════════════════════════════════════════════════════
// PLACE ORDER
// ════════════════════════════════════════════════════════════
function placeOrder() {
  const nameInput  = document.getElementById('custName');
  const phoneInput = document.getElementById('custPhone');
  const nameErr    = document.getElementById('nameErr');
  const phoneErr   = document.getElementById('phoneErr');

  const name  = nameInput?.value.trim() || '';
  const phone = phoneInput?.value.trim() || '';

  let valid = true;

  if (!name) {
    if (nameErr) nameErr.style.display = 'block';
    if (nameInput) nameInput.focus();
    valid = false;
  } else {
    if (nameErr) nameErr.style.display = 'none';
  }

  if (!phone || phone.replace(/\D/g,'').length < 6) {
    if (phoneErr) phoneErr.style.display = 'block';
    if (valid && phoneInput) phoneInput.focus();
    valid = false;
  } else {
    if (phoneErr) phoneErr.style.display = 'none';
  }

  if (!valid) return;

  const pickup = document.getElementById('pTime')?.value || '';

  const items = Object.values(cart).map(function(item) {
    return { nombre: item.name, cantidad: item.qty, precio: item.price };
  });

  const payload = {
    customerName: name,
    phone: phone,
    pickupTime: pickup || null,
    items: items
  };

  const btn = document.getElementById('orderBtn');
  btn.disabled = true;
  btn.textContent = lang === 'es' ? 'Enviando...' : 'Sending...';

  fetch('/api/orders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(function(res) {
    if (!res.ok) throw new Error('Error');
    return res.json();
  })
  .then(function() {
    showSuccess(name, phone, pickup);
  })
  .catch(function() {
    btn.disabled = false;
    btn.textContent = t('placeOrder');
    alert(lang === 'es' ? 'Error al enviar el pedido. Inténtalo de nuevo.' : 'Error sending order. Please try again.');
  });
}

function showSuccess(name, phone, pickup) {
  closeCart();
  document.getElementById('sTitle').textContent    = t('ok');
  document.getElementById('sCustomer').textContent = name + ' 👋';
  document.getElementById('sBtnClose').textContent = t('great');
  let msg = t('thanks');
  if (pickup) msg += '\n' + t('pickAt') + pickup;
  msg += '\n\n' + t('payNote');
  document.getElementById('sMsg').textContent = msg;
  document.getElementById('sbg').classList.add('on');
  cart = {};
  refreshBadge();
  if (curSec) renderSec(curSec);
}
function closeSuccess() { document.getElementById('sbg').classList.remove('on'); }

// ════════════════════════════════════════════════════════════
// QR
// ════════════════════════════════════════════════════════════
function openQR() {
  const card = document.getElementById('qCardSingle');
  if (!card.hasChildNodes()) {
    const base = window.location.origin + window.location.pathname;
    new QRCode(card, {text:base, width:160, height:160, colorDark:'#000', colorLight:'#fff', correctLevel:QRCode.CorrectLevel.H});
    const lbl = document.createElement('div'); lbl.className='qtname'; lbl.textContent='Bar Aeródromo La Juliana';
    const url = document.createElement('div'); url.className='qurl'; url.textContent=base;
    card.append(lbl, url);
    document.getElementById('qPrint').style.display = 'block';
  }
  document.getElementById('qbg').classList.add('on');
}
function closeQR() { document.getElementById('qbg').classList.remove('on'); }
function qrBgClick(e) { if (e.target===document.getElementById('qbg')) closeQR(); }

    + 'h1{font-size:22px;color:#c9a84c;margin-bottom:2px}h2{font-size:16px;color:#c9a84c;font-style:italic;margin-bottom:20px}'

    + '@media print{@page{size:A5;margin:10mm}}</style>'
